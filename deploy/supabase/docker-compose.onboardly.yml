# Onboardly overrides for the official Supabase self-hosting stack.
# Used as:  docker compose -f supabase-stack/docker-compose.yml -f supabase/docker-compose.onboardly.yml
#
# - Unique project + container names, so it never clashes with other projects
#   (including another self-hosted Supabase) on the same server.
# - No public ports. The gateway is reachable only through your reverse proxy
#   and on 127.0.0.1 (for Studio over an SSH tunnel).
# - Services Onboardly doesn't use are disabled to save memory.
# Requires Docker Compose v2.24.4+ (for !override).

name: onboardly-db

services:
  db:
    container_name: onboardly-db-postgres
  auth:
    container_name: onboardly-db-auth
  rest:
    container_name: onboardly-db-rest
  storage:
    container_name: onboardly-db-storage
  imgproxy:
    container_name: onboardly-db-imgproxy
  meta:
    container_name: onboardly-db-meta
  studio:
    container_name: onboardly-db-studio

  api-gw:
    container_name: onboardly-db-gateway
    ports: !override
      - "127.0.0.1:${GATEWAY_LOCAL_PORT:-18000}:8000"
    networks:
      proxy: {}
    labels:
      # Traefik (ignored by other proxies). Only the API paths the app needs are
      # routed publicly; Studio and the meta API stay private.
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.routers.onboardly-api.rule=Host(`${API_DOMAIN}`) && (PathPrefix(`/auth/v1`) || PathPrefix(`/rest/v1`) || PathPrefix(`/storage/v1`))"
      - "traefik.http.routers.onboardly-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.onboardly-api.tls=true"
      - "traefik.http.routers.onboardly-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.onboardly-api.loadbalancer.server.port=8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Not used by Onboardly.
  realtime:
    profiles: ["disabled"]
  functions:
    profiles: ["disabled"]
  supavisor:
    profiles: ["disabled"]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
