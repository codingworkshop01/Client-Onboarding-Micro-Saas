# Onboardly app stack. Run via deploy/scripts/deploy.sh (it passes the env file).
name: onboardly

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Onboardly}
        NEXT_PUBLIC_SUPABASE_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: onboardly-app:latest
    container_name: onboardly-app
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Onboardly}
      NEXT_PUBLIC_SUPABASE_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SOLO: ${STRIPE_PRICE_SOLO:-}
      STRIPE_PRICE_AGENCY: ${STRIPE_PRICE_AGENCY:-}
      STRIPE_PRICE_SCALE: ${STRIPE_PRICE_SCALE:-}
      CRON_SECRET: ${CRON_SECRET}
    networks: [default, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.routers.onboardly-app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.onboardly-app.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.onboardly-app.tls=true"
      - "traefik.http.routers.onboardly-app.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.onboardly-app.loadbalancer.server.port=3000"
    logging: *logging

  # Hourly automatic reminders (replaces vercel.json on a VPS).
  cron:
    image: alpine:3.20
    container_name: onboardly-cron
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "5 * * * * wget -qO- -T 120 --header 'Authorization: Bearer $$CRON_SECRET' http://app:3000/api/cron/reminders; echo" > /etc/crontabs/root
        exec crond -f -l 8
    logging: *logging

  # Daily database + uploaded files backup into deploy/backups.
  backup:
    image: postgres:17-alpine
    container_name: onboardly-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backup:/scripts:ro
      - ./backups:/backups
      - ./supabase-stack/volumes/storage:/storage:ro
    networks: [db]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 ${BACKUP_HOUR:-3} * * * /bin/sh /scripts/backup.sh" > /etc/crontabs/root
        exec crond -f -l 8
    logging: *logging

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
  db:
    external: true
    name: onboardly-db_default
